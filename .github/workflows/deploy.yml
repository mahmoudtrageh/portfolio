name: deploy

on:
  # Deploys run only after the tests workflow passes on main.
  workflow_run:
    workflows: [tests]
    types: [completed]
    branches: [main]
  # Manual trigger, for redeploying without a new commit.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  SITE_URL: https://mahmoudtaha.dev

jobs:
  deploy:
    runs-on: ubuntu-latest
    # workflow_run fires even when tests fail — gate on the conclusion.
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # workflow_run checks out the default branch by default; be explicit.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm

      # vendor/ is not deployed — the server installs its own. This runs so a
      # lock file that cannot be installed fails here rather than on the server.
      - name: Verify PHP dependencies install
        run: composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader

      - name: Build assets
        run: |
          npm ci
          npm run build

      # public/build is gitignored, so it only exists if the build ran. vendor/
      # is checked because the zip for manual upload is built from it.
      - name: Verify build output exists
        run: |
          test -f vendor/autoload.php || { echo "vendor/ missing"; exit 1; }
          test -f public/build/manifest.json || { echo "public/build missing"; exit 1; }
          # Deployed flat into the domain's folder, so the root .htaccess is what
          # keeps .env and vendor/ from being served. Without it the app root
          # is publicly readable — refuse to deploy.
          test -f .htaccess || { echo "root .htaccess missing"; exit 1; }
          echo "vendor/, public/build and .htaccess present."

      # vendor/ is not uploaded; the server installs it from composer.lock via
      # cPanel Terminal. Warn when the lock changes so that step is not missed.
      - name: Check whether composer install is needed on the server
        run: |
          before=$(git rev-parse "${{ github.event.workflow_run.head_sha || github.sha }}^" 2>/dev/null || echo "")

          if [ -z "$before" ] || git diff --quiet "$before" HEAD -- composer.lock 2>/dev/null; then
            echo "composer.lock unchanged — the server's vendor/ is still current."
            exit 0
          fi

          echo "::warning title=composer install needed::composer.lock changed. Run 'cd ~/mahmoudtaha.dev && composer install --no-dev --optimize-autoloader' in cPanel Terminal, or production keeps running the old packages."

      # Namecheap drops idle FTP connections ("FIN packet unexpectedly"), so
      # give each operation longer than the 30s default. The sync-state file
      # makes a retry incremental: it resumes rather than re-uploading.
      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@8e83cea8672e3fbcbb9fdafff34debf6ae4c5f65 # v4.3.5
        continue-on-error: true
        id: ftp1
        with:
          server: 66.29.141.240
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          timeout: 120000
          server-dir: /mahmoudtaha.dev/
          # Incremental sync state, so only changed files transfer.
          state-name: .ftp-deploy-sync-state.json
          dry-run: false
          # vendor/ is excluded: it is thousands of files and makes every FTP
          # run slow. The server installs it itself from composer.lock, via
          # cPanel Terminal — so composer.json and composer.lock DO upload.
          #
          # bootstrap/cache/*.php IS excluded: nothing runs artisan on this
          # server, so a cached config would never be rebuilt, and the local
          # copy is built from dev .env values. Uploading one would pin
          # production to dev config permanently.
          #
          # (These comments live here because `exclude` takes globs only —
          # a '#' line inside the block is treated as a literal pattern.)
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/vendor/**
            **/tests/**
            .env
            .editorconfig
            phpunit.xml
            phpstan.neon
            pint.json
            package-lock.json
            **/storage/app/**
            **/storage/logs/**
            **/storage/tmp/**
            **/storage/framework/cache/**
            **/storage/framework/sessions/**
            **/storage/framework/views/**
            **/public/storage/**
            *.md
            bootstrap/cache/*.php

      # One retry. The sync-state file means this resumes where the first
      # attempt stopped rather than starting over.
      - name: Deploy via FTP (retry)
        if: steps.ftp1.outcome == 'failure'
        uses: SamKirkland/FTP-Deploy-Action@8e83cea8672e3fbcbb9fdafff34debf6ae4c5f65 # v4.3.5
        with:
          server: 66.29.141.240
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          timeout: 120000
          server-dir: /mahmoudtaha.dev/
          state-name: .ftp-deploy-sync-state.json
          dry-run: false
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/vendor/**
            **/tests/**
            .env
            .editorconfig
            phpunit.xml
            phpstan.neon
            pint.json
            package-lock.json
            **/storage/app/**
            **/storage/logs/**
            **/storage/tmp/**
            **/storage/framework/cache/**
            **/storage/framework/sessions/**
            **/storage/framework/views/**
            **/public/storage/**
            *.md
            bootstrap/cache/*.php

      - name: Verify site responds
        run: |
          code=$(curl -sS -o /dev/null -w '%{http_code}' \
            --max-time 30 -L "$SITE_URL")
          echo "GET $SITE_URL -> $code"
          case "$code" in
            2*|3*) ;;
            *) echo "Site did not return a healthy status."; exit 1 ;;
          esac

      # The app root sits inside the web root, so this is the check that
      # matters: confirm Apache is actually refusing the sensitive paths.
      - name: Verify sensitive paths are not exposed
        run: |
          # Every path here is a file the deploy actually uploads, so a non-200
          # means .htaccess blocked it — not that the file is simply absent.
          failed=0
          for path in /.env /composer.json /composer.lock /artisan \
                      /config/app.php /routes/web.php; do
            code=$(curl -sS -o /dev/null -w '%{http_code}' \
              --max-time 20 "$SITE_URL$path" || echo 000)
            if [ "$code" = "200" ]; then
              echo "EXPOSED: $path returned 200"
              failed=1
            else
              echo "ok: $path -> $code"
            fi
          done
          [ "$failed" = "0" ] || {
            echo
            echo "Sensitive files are publicly readable. Check that the root"
            echo ".htaccess uploaded and that mod_rewrite is enabled."
            exit 1
          }
